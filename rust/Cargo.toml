[package]
name = "firefly"
version = "0.2.0"
edition = "2021"
description = "Firefly: Graph Substrate Compiler with 10K Hamming Resonance"
license = "MIT"
repository = "https://github.com/AdaWorldAPI/firefly"
keywords = ["hamming", "vector", "graph", "compiler", "content-addressable"]
categories = ["algorithms", "data-structures", "compilers"]

[dependencies]
# Crypto
sha2 = "0.10"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Async runtime
tokio = { version = "1.0", features = ["full", "parking_lot"] }

# Async traits
async-trait = "0.1"

# UUID generation
uuid = { version = "1.0", features = ["v4"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# CRC for packet checksums
crc32fast = "1.3"

# =============================================================================
# MODERN FEATURES
# =============================================================================

# Work-stealing parallelism (graph execution)
rayon = "1.10"

# Better locks (faster than std)
parking_lot = "0.12"

# Concurrent hash maps (lock-free)
dashmap = "6.0"

# Bytes for zero-copy operations
bytes = "1.5"

# Tracing for observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# =============================================================================
# OPTIONAL DATABASE INTEGRATIONS
# =============================================================================

# Graph database (LadybugDB/Kuzu fork)
kuzu = { version = "0.11", optional = true }

# Redis streams with cluster support
fred = { version = "10.0", optional = true, default-features = false, features = [
    "transactions",
    "subscriber-client",
    "serde-json",
    "metrics",
] }

# Lance vector store
# lancedb = { version = "0.4", optional = true }

[dev-dependencies]
criterion = "0.5"
proptest = "1.4"
tokio-test = "0.4"

[[bench]]
name = "hamming_bench"
harness = false

[[example]]
name = "standalone"
path = "standalone.rs"

[features]
default = ["work-steal"]
simd = []  # Future: SIMD acceleration
work-steal = []  # Work-stealing graph execution
redis = ["fred"]  # Redis stream transport
graph-db = ["kuzu"]  # LadybugDB/Kuzu integration
full = ["work-steal", "redis", "graph-db"]
