[package]
name = "firefly"
version = "0.1.0"
edition = "2021"
description = "Firefly: Graph Substrate Compiler with 10K Hamming Resonance"
license = "MIT"
repository = "https://github.com/AdaWorldAPI/firefly"
keywords = ["hamming", "vector", "graph", "compiler", "content-addressable"]
categories = ["algorithms", "data-structures", "compilers"]

[dependencies]
# Crypto
sha2 = "0.10"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"

# Error handling
thiserror = "1.0"

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Async traits
async-trait = "0.1"

# UUID generation
uuid = { version = "1.0", features = ["v4"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# CRC for packet checksums
crc32fast = "1.3"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "hamming_bench"
harness = false

[[example]]
name = "standalone"
path = "standalone.rs"

[features]
default = []
simd = []  # Future: SIMD acceleration
