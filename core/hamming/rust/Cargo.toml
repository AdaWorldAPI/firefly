[package]
name = "firefly_core"
version = "0.1.0"
edition = "2021"
description = "Firefly Core: 10K Hamming Resonance Engine"
license = "MIT"
repository = "https://github.com/AdaWorldAPI/firefly"
keywords = ["hamming", "vector", "similarity", "content-addressable"]
categories = ["algorithms", "data-structures"]

[dependencies]
sha2 = "0.10"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "hamming_bench"
harness = false

[[example]]
name = "standalone"
path = "standalone.rs"

[features]
default = []
simd = []  # Future: SIMD acceleration
